<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">
    <span class="fechar">&times;</span>
    <span class="anterior">&#10094;</span>
    <img id="img-ampliada" alt="Imagem ampliada">
    <span class="proximo">&#10095;</span>

</div>

<script>
    
const lightbox = document.getElementById("lightbox");
const imagem = document.getElementById("img-ampliada");
const fotos = document.querySelectorAll(".grid-fotos img");
let indice = 0;
function abrirImagem(img){
    indice = Array.from(fotos).indexOf(img);
    imagem.src = fotos[indice].src;
    lightbox.style.display = "flex";
}

function mostrarImagem(){
    imagem.src = fotos[indice].src;
}

document.querySelector(".proximo").onclick = function(){
    indice++;
    if(indice >= fotos.length){
        indice = 0;
    }

    mostrarImagem();
}

document.querySelector(".anterior").onclick = function(){
    indice--;
    if(indice < 0){
        indice = fotos.length - 1;
    }

    mostrarImagem();
}

document.querySelector(".fechar").onclick = function(){
    lightbox.style.display = "none";
}

lightbox.onclick = function(e){
    if(e.target === lightbox){
        lightbox.style.display = "none";
    }

}

document.addEventListener("keydown", function(e){
    if(lightbox.style.display !== "flex") return;
    if(e.key === "ArrowRight"){
        document.querySelector(".proximo").click();
    }

    if(e.key === "ArrowLeft"){
        document.querySelector(".anterior").click();
    }

    if(e.key === "Escape"){
        lightbox.style.display = "none";
    }

});

</script>
